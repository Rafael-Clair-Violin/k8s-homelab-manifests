apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace para todos os recursos
namespace: guacamole

# Labels comuns aplicados a todos os recursos

# Annotations comuns
commonAnnotations:
  config.kubernetes.io/origin: |
    path: manifests/kustomization.yaml

# Recursos base
  # Namespace e configurações base

  # PostgreSQL

  # Guacd (daemon)

  # Guacamole (frontend)
resources:
- namespace.yaml
- secrets.yaml
- configmaps.yaml
- postgresql/pvc.yaml
- postgresql/deployment.yaml
- postgresql/service.yaml
- guacd/deployment.yaml
- guacd/service.yaml
- guacamole/pvc.yaml
- guacamole/deployment.yaml
- guacamole/service.yaml
- guacamole/ingress.yaml

# Patches para personalização
  # PostgreSQL - recursos de memória

  # Guacamole - definir replicas

  # Guacd - definir replicas

  # Adicionar sync waves via patches (método correto)



patches:
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: "512Mi"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: "1Gi"
  target:
    kind: Deployment
    name: postgresql
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
  target:
    kind: Deployment
    name: guacamole
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
  target:
    kind: Deployment
    name: guacd
- patch: |-
    - op: add
      path: /metadata/annotations/argocd.argoproj.io~1sync-wave
      value: "1"
  target:
    kind: PersistentVolumeClaim
- patch: |-
    - op: add
      path: /metadata/annotations/argocd.argoproj.io~1sync-wave
      value: "2"
  target:
    kind: Deployment
    name: postgresql
- patch: |-
    - op: add
      path: /metadata/annotations/argocd.argoproj.io~1sync-wave
      value: "3"
  target:
    kind: Deployment
    name: guacd
- patch: |-
    - op: add
      path: /metadata/annotations/argocd.argoproj.io~1sync-wave
      value: "4"
  target:
    kind: Deployment
    name: guacamole

# Imagens (para facilitar updates)
images:
- name: postgres
  newTag: 15-alpine
- name: guacamole/guacd
  newTag: 1.5.4
- name: guacamole/guacamole
  newTag: 1.5.4

# ConfigMap generator para variáveis de ambiente
configMapGenerator:
- literals:
  - GUACD_HOSTNAME=guacd
  - GUACD_PORT=4822
  - POSTGRES_HOSTNAME=postgresql
  - POSTGRES_PORT=5432
  - POSTGRES_DATABASE=guacamole_db
  name: guacamole-env-config
labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/instance: guacamole-prod
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: guacamole
    app.kubernetes.io/part-of: guacamole-stack
    app.kubernetes.io/version: 1.5.4
