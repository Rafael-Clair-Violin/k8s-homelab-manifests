apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: guacamole
  annotations:
    config.kubernetes.io/local-config: "true"

# Namespace para todos os recursos
namespace: guacamole

# Labels comuns aplicados a todos os recursos
commonLabels:
  app.kubernetes.io/name: guacamole
  app.kubernetes.io/instance: guacamole-prod
  app.kubernetes.io/version: "1.5.4"
  app.kubernetes.io/managed-by: argocd
  app.kubernetes.io/part-of: guacamole-stack

# Annotations comuns
commonAnnotations:
  config.kubernetes.io/origin: |
    path: manifests/kustomization.yaml
  argocd.argoproj.io/sync-wave: "0"

# Recursos base
resources:
  # Namespace e configurações base
  - namespace.yaml
  - secrets.yaml
  - configmaps.yaml
  
  # PostgreSQL
  - postgresql/pvc.yaml
  - postgresql/deployment.yaml
  - postgresql/service.yaml
  
  # Guacd (daemon)
  - guacd/deployment.yaml
  - guacd/service.yaml
  
  # Guacamole (frontend)
  - guacamole/pvc.yaml
  - guacamole/deployment.yaml
  - guacamole/service.yaml
  - guacamole/ingress.yaml

# Patches para personalização
patches:
  # Ajustar recursos baseado no ambiente
  - target:
      kind: Deployment
      name: postgresql
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
  
  # Configurar replicas baseado no ambiente
  - target:
      kind: Deployment
      name: guacamole
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  
  - target:
      kind: Deployment
      name: guacd
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2

# Imagens (para facilitar updates)
images:
  - name: postgres
    newTag: "15-alpine"
  - name: guacamole/guacd
    newTag: "1.5.4"
  - name: guacamole/guacamole
    newTag: "1.5.4"

# ConfigMap e Secret generators (opcional)
configMapGenerator:
  - name: guacamole-env-config
    literals:
      - GUACD_HOSTNAME=guacd
      - GUACD_PORT=4822
      - POSTGRES_HOSTNAME=postgresql
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=guacamole_db

# Transformações
transformers:
  # Adicionar sync waves para ordem de deploy
  - |-
    apiVersion: builtin
    kind: AnnotationsTransformer
    metadata:
      name: sync-wave-transformer
    annotations:
      argocd.argoproj.io/sync-wave: "1"
    targets:
      - kind: PersistentVolumeClaim
    fieldSpecs:
      - path: metadata/annotations
        create: true
  
  - |-
    apiVersion: builtin
    kind: AnnotationsTransformer
    metadata:
      name: sync-wave-db-transformer
    annotations:
      argocd.argoproj.io/sync-wave: "2"
    targets:
      - kind: Deployment
        name: postgresql
    fieldSpecs:
      - path: metadata/annotations
        create: true
  
  - |-
    apiVersion: builtin
    kind: AnnotationsTransformer
    metadata:
      name: sync-wave-app-transformer
    annotations:
      argocd.argoproj.io/sync-wave: "3"
    targets:
      - kind: Deployment
        name: guacd
      - kind: Deployment
        name: guacamole
    fieldSpecs:
      - path: metadata/annotations
        create: true

# Validações
openapi:
  path: https://raw.githubusercontent.com/kubernetes/kubernetes/master/api/openapi-spec/swagger.json