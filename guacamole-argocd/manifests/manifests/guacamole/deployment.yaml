apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole
  namespace: guacamole
  labels:
    app: guacamole
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: guacamole
  template:
    metadata:
      labels:
        app: guacamole
    spec:
      initContainers:
      - name: wait-for-db
        image: postgres:15-alpine
        command: ['sh', '-c']
        args:
        - |
          until pg_isready -h postgresql -p 5432 -U $POSTGRES_USER; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL is ready!"
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: guacamole-secrets
              key: postgres-user
      containers:
      - name: guacamole
        image: guacamole/guacamole:1.5.4
        env:
        - name: GUACD_HOSTNAME
          value: guacd
        - name: GUACD_PORT
          value: "4822"
        - name: POSTGRES_HOSTNAME
          value: postgresql
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DATABASE
          value: guacamole_db
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: guacamole-secrets
              key: postgres-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: guacamole-secrets
              key: postgres-password
        - name: GUACAMOLE_HOME
          value: /etc/guacamole
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: guacamole-config
          mountPath: /etc/guacamole
        livenessProbe:
          httpGet:
            path: /guacamole
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /guacamole
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: guacamole-config
        persistentVolumeClaim:
          claimName: guacamole-config-pvc